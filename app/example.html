<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>专注今天</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182d30;background:#f2f6f5}*{box-sizing:border-box}body{margin:0;padding:48px 24px}main{max-width:600px;margin:auto}header{margin-bottom:32px}.label{font-size:12px;letter-spacing:3px;color:#54746d}h1{font-size:36px;letter-spacing:-1px;margin:12px 0}p{color:#647873}form{display:flex;gap:8px;padding:10px;background:white;border:1px solid #d9e4df;border-radius:14px}input{font:inherit;padding:12px;flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:12px 18px;background:#167461;color:white}button:focus-visible,input:focus-visible{outline:2px solid #0caa88;outline-offset:2px}nav{display:flex;gap:8px;margin:24px 0}nav button{padding:8px 12px;background:transparent;color:#56736b}nav button[aria-pressed=true]{background:#dcece5;color:#12694f}ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #dce5e0}li input{flex:0;width:19px;height:19px;accent-color:#168367}li span{flex:1;overflow-wrap:anywhere}.done span{text-decoration:line-through;opacity:.5}.remove{background:transparent;color:#738c84;font-size:14px;padding:6px}.empty{text-align:center;padding:40px;color:#72867e}footer{font-size:13px;color:#778a82;margin-top:30px}#error{color:#ba453d}[data-theme=dark]{background:#132624;color:#ddefe9}[data-theme=dark] form{background:#1c3530;border-color:#365047}[data-theme=dark] li{border-color:#365047}[data-theme=dark] nav button[aria-pressed=true]{background:#325b4d;color:#c7f6e2}@media(max-width:400px){body{padding:28px 16px}h1{font-size:30px}button{padding:12px}}
</style></head>
<body><main><header><div class="label">A LITTLE PROGRESS, EVERY DAY</div><h1>专注今天。</h1><p id="count">把想做的事，一件件完成。</p></header>
<form id="form"><input id="task" aria-label="新的待办事项" placeholder="接下来想完成什么？" maxlength="160" required><button>添加</button></form>
<nav aria-label="筛选"><button data-filter="all" aria-pressed="true">全部</button><button data-filter="active" aria-pressed="false">未完成</button><button data-filter="done" aria-pressed="false">已完成</button></nav>
<ul id="tasks"></ul><p id="empty" class="empty">留一点空间，给今天的第一件事。</p><p id="error" role="alert"></p><footer>每一步，都算数。 · 数据会自动保存</footer></main>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
let tasks=[],filter='all'; const list=document.querySelector('#tasks'),error=document.querySelector('#error');
async function save(){try{await window.demoStorage.save({tasks});error.textContent=''}catch(e){error.textContent='保存失败，请重试。'}}
function render(){list.replaceChildren(); const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)); document.querySelector('#empty').hidden=shown.length>0;document.querySelector('#count').textContent=`${tasks.filter(t=>t.done).length} / ${tasks.length} 件事已完成`;
for(const t of shown){const li=document.createElement('li');li.className=t.done?'done':'';const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label','完成 '+t.text);check.onchange=async()=>{t.done=check.checked;render();await save()};const text=document.createElement('span');text.textContent=t.text;const remove=document.createElement('button');remove.className='remove';remove.textContent='删除';remove.setAttribute('aria-label','删除 '+t.text);remove.onclick=async()=>{tasks=tasks.filter(x=>x.id!==t.id);render();await save()};li.append(check,text,remove);list.append(li)}}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const input=document.querySelector('#task');const text=input.value.trim();if(!text)return;tasks.push({id:crypto.randomUUID(),text,done:false});input.value='';render();await save()};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
try{const stored=await window.demoStorage.load();tasks=Array.isArray(stored.tasks)?stored.tasks.filter(t=>typeof t.text==='string'&&typeof t.id==='string').map(t=>({id:t.id,text:t.text,done:!!t.done})):[]}catch(e){error.textContent='无法读取保存的数据。'}render();
});
</script></body></html>
